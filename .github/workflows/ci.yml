name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
jobs:
  quality:
    name: "Quality / Rust"
    uses: xila-project/workspace/.github/workflows/quality.yml@0adf14f42ce3bb004b2fe6e7e66be813abda9666
    with:
      extra-task: ci:quality-extra
  guest:
    name: "Build / WASI guests"
    runs-on: ubuntu-latest
    env:
      XILA_MBX: "1"
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-mode: target
          cache-generation: v1-apps-wasi
      - name: "Setup | Clang and linker dependencies"
        run: mise run ci:packages-linker
      - name: "Lint | WASI guests"
        run: mise run ci:clippy-guest
      - name: "Build | WASI applications"
        run: mise run build:applications
      - name: "Report | Upload build artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: wasi-applications
          path: target/wasm32-wasip1/release-wasm/*.wasm
          if-no-files-found: error
  host:
    name: "Build & Test / Native host"
    runs-on: ubuntu-latest
    env:
      XILA_MBX: "1"
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-mode: target
          cache-generation: v1-apps-host
      - name: "Setup | Locked npm dependencies"
        run: mise run ci:deps-npm
      - name: "Setup | Native build dependencies"
        run: mise run ci:packages-host
      - name: "Lint | Native host"
        run: mise run ci:clippy-host
      - name: "Lint | Wasm host runtime"
        run: cargo clippy --locked -p xila-wasm --features graphics,xila/graphics_rendering_xrgb8888 --target x86_64-unknown-linux-gnu -- -D warnings
      - name: "Test | Application workspace"
        run: mise run test:workspace
  abi:
    name: "Test / ABI (${{ matrix.memory }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        memory: [memory_32, memory_64]
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Setup | Rust toolchain for ABI"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: "Test | ABI translation"
        run: cargo test --locked --manifest-path executables/wasm/tests/translation/Cargo.toml --no-default-features --features ${{ matrix.memory }}
  localization:
    name: "Test / Localization (${{ matrix.locale }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [en, fr, es, de, pt-BR, it, pl, zh-CN, ja]
    env:
      XILA_MBX: "1"
      EMBEDDED_I18N_LOCALE: ${{ matrix.locale }}
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      # These checkouts only affect Japanese CI validation.
      - name: "Setup | Checkout companion Core"
        uses: actions/checkout@v7
        if: matrix.locale == 'ja'
        with:
          repository: xila-project/core
          ref: c656f83b6cfd019ed469332182166bdaf6188ca9
          path: .ci-core-ja
          persist-credentials: false
      - name: "Setup | Checkout Platforms"
        uses: actions/checkout@v7
        if: matrix.locale == 'ja'
        with:
          repository: xila-project/platforms
          ref: 6ced809bdb8313a2aef02561bece4bc31ec19da8
          path: .ci-platforms-ja
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-mode: objects
          cache-generation: v1-apps-localization
      - name: "Setup | Clang and linker dependencies"
        run: mise run ci:packages-linker
      - name: "Test | Localization"
        if: matrix.locale != 'ja'
        run: mise run ci:localization
      - name: "Test | Japanese with companion Core"
        if: matrix.locale == 'ja'
        env:
          XILA_MBX: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/xila-ja-target
        run: |
          cp -a .ci-core-ja "$RUNNER_TEMP/xila-core-ja"
          cp -a .ci-platforms-ja "$RUNNER_TEMP/xila-platforms-ja"
          mise run ci:localization-japanese
  package:
    name: "Package / ${{ matrix.app }}"
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        app: [calculator, clock, weather, pixel_painter, text_editor, synth]
    permissions:
      contents: read
      id-token: write
    secrets:
      XILA_DEV_SIGNING_SEED_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.XILA_DEV_SIGNING_SEED_B64 || '' }}
    uses: xila-project/package_manager/.github/workflows/package-wasm.yml@277d017c2da182b7d72081e4ca1dd555425c35bf
    with:
      wasm-artifact: wasi-applications
      wasm-path: ${{ matrix.app }}.wasm
      manifest-path: packaging/${{ matrix.app }}.json
      shortcut-path: executables/${{ matrix.app }}/shortcut.json
      builder-ref: 277d017c2da182b7d72081e4ca1dd555425c35bf
      artifact-name: package-${{ matrix.app }}
      publish-release: false
      sign-artifact: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  required:
    if: always()
    needs: [quality, guest, host, abi, localization, package]
    runs-on: ubuntu-latest
    steps:
      - name: "Gate | Verify mandatory checks"
        env:
          QUALITY: ${{ needs.quality.result }}
          GUEST: ${{ needs.guest.result }}
          HOST: ${{ needs.host.result }}
          ABI: ${{ needs.abi.result }}
          LOCALIZATION: ${{ needs.localization.result }}
          PACKAGE: ${{ needs.package.result }}
        run: test "$QUALITY" = success && test "$GUEST" = success && test "$HOST" = success && test "$ABI" = success && test "$LOCALIZATION" = success && test "$PACKAGE" = success
  release:
    name: "Release / Signed bundles"
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: application-release
      cancel-in-progress: false
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: "Setup | Rust toolchain"
        uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-enabled: "false"
      # Tags created here with GITHUB_TOKEN start no workflow, so the bundles
      # built and signed earlier in this run are attached directly.
      - name: "Publish | Tags and GitHub releases"
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Setup | Download signed bundles"
        if: steps.release-plz.outputs.releases_created == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: ${{ runner.temp }}/bundles
      - name: "Publish | Attach signed bundles to releases"
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
          BUNDLES: ${{ runner.temp }}/bundles
        run: |
          set -euo pipefail
          jq -c '.[]' <<< "$RELEASES" | while read -r release; do
            crate="$(jq -r .package_name <<< "$release")"
            tag="$(jq -r .tag <<< "$release")"
            version="$(jq -r .version <<< "$release")"
            name="${crate#xila-}"
            archive="$BUNDLES/package-${name//-/_}/xila.$name-$version-wasm32-wasip1.xpk"
            for file in "$archive" "$archive.sha256" "$archive.pub"; do
              test -f "$file" || { echo "::error::missing $file for $tag"; exit 1; }
            done
            gh release upload "$tag" "$archive" "$archive.sha256" "$archive.pub" --repo "$GITHUB_REPOSITORY"
          done
  release-pr:
    name: "Release / Version pull request"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: application-release-pr
      cancel-in-progress: false
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: "Setup | Rust toolchain"
        uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-enabled: "false"
      - name: "Publish | Version pull request"
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-plz bumps Cargo.toml only; keep packaging/<app>.json in step.
      - name: "Sync | Package manifest versions"
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != '{}'
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail
          branch="$(jq -r .head_branch <<< "$PR")"
          git fetch origin "$branch"
          git switch -C "$branch" "origin/$branch"
          python3 tools/validate_manifests.py --sync
          if ! git diff --quiet -- packaging; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(packaging): sync package manifest versions" -- packaging
            git push origin "$branch"
          fi
