name: Application packages
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release-version:
    runs-on: ubuntu-latest
    steps:
      - name: "Setup | Checkout application sources"
        uses: actions/checkout@v7
      - name: "Validate | Tagged release manifests"
        env:
          XILA_RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/validate_manifests.py
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
  release:
    needs: [validate, release-version]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [calculator, clock, weather, pixel_painter, text_editor, synth]
    permissions:
      contents: write
      id-token: write
    secrets:
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
    uses: xila-project/package_manager/.github/workflows/package-wasm.yml@7a545fe25f386aa5a38bedc37b6a41b492214ef8
    with:
      wasm-artifact: wasi-applications
      wasm-path: ${{ matrix.app }}.wasm
      manifest-path: packaging/${{ matrix.app }}.json
      builder-ref: 7a545fe25f386aa5a38bedc37b6a41b492214ef8
      artifact-name: release-package-${{ matrix.app }}
      publish-release: true
      release-tag: ${{ github.ref_name }}
