[profile.release-wasm]
inherits = "release"
opt-level = 's'
strip = true
lto = true

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
repository = "https://github.com/xila-project/core"

[workspace.dependencies]
xila = { git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
xila_http = { git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c", default-features = false }
verification = { git = "https://github.com/xila-project/package_manager", rev = "f5e3f0b323a79a80d106ce2b88b77bfa8667d71b", default-features = false }
audio = { package = "xila-audio", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
nanoaudio = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-cpal = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-web = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-synth = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
abi_declarations = { package = "xila-abi-declarations", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
abi_definitions = { package = "xila-abi-definitions", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
little_fs = { package = "xila-little-fs", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
virtual_file_system = { package = "xila-virtual-file-system", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
graphics = { package = "xila-graphics", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
time = { package = "xila-time", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
task = { package = "xila-task", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
users = { package = "xila-users", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
memory = { package = "xila-memory", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
executable = { package = "xila-executable", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
file_system = { package = "xila-file-system", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
authentication = { package = "xila-authentication", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
log = { package = "xila-log", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
shared = { package = "xila-shared", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
synchronization = { package = "xila-synchronization", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
network = { package = "xila-network", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
debug_protocol = { package = "xila-debug-protocol", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
peripherals = { package = "xila-peripherals", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
bootsplash = { package = "xila-bootsplash", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }
embedded-i18n = { version = "=0.2.0", default-features = false, features = [
  "backend-json",
] }
testing = { package = "xila-testing", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c", features = [
  "environment",
  "graphics",
] }
device = { package = "xila-device", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }

# - Drivers
drivers_core = { package = "xila-drivers-core", git = "https://github.com/xila-project/core", rev = "e2f221a8a489b6b989a3926c6bbbd20bc152e06c" }

# - Executables
file_manager = { package = "xila-file-manager", path = "executables/file_manager" }
command_line_shell = { package = "xila-command-line-shell", path = "executables/shell/command_line" }
graphical_shell = { package = "xila-graphical-shell", path = "executables/shell/graphical" }
wasm = { package = "xila-wasm", path = "executables/wasm" }
terminal = { package = "xila-terminal", path = "executables/terminal" }
settings = { package = "xila-settings", path = "executables/settings" }
debug_application = { package = "xila-debug-application", path = "executables/debug" }
activity = { package = "xila-activity", path = "executables/activity" }
pixel_painter = { package = "xila-pixel-painter", path = "executables/pixel_painter" }
text_editor = { package = "xila-text-editor", path = "executables/text_editor" }
calculator = { package = "xila-calculator", path = "executables/calculator" }
weather = { package = "xila-weather", path = "executables/weather" }
clock = { package = "xila-clock", path = "executables/clock" }
synth = { package = "xila-synth", path = "executables/synth" }

# - External crates
embedded-hal = { version = "1", default-features = false }
miniserde = { version = "0.1" }
bindgen = { version = "0.73" }
cbindgen = { version = "0.29" }
syn = { version = "3.0" }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
lvgl_rust_sys = { git = "https://github.com/Xila-Project/lvgl_rust_sys.git", rev = "90038a9f63c3d711dfdb87069239002629e2121b", default-features = false }
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = { version = "0.1" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }
critical-section = { version = "1.2" }
smoltcp = { version = "0.14" }
linked_list_allocator = { version = "0.10", default-features = false, features = [
  "const_mut_refs",
] }
smol_str = { version = "0.3" }
darling = { version = "0.24" }
regex = { version = "1" }
embedded-io-async = { version = "0.7", features = ["alloc"] }
embedded-io = { version = "0.7", features = ["alloc"] }
embedded-tls = { version = "0.19", default-features = false, features = [
  "alloc",
] }
getargs-derive = { git = "https://github.com/AlixANNERAUD/getargs-derive.git", rev = "65b20961504ad5ba387ea13f0e9501036941ab17" } # v0.1.0

[workspace]
resolver = "3"
members = [
  "executables/wasm",
  "executables/wasm/tests/wasm_test",
  "executables/package",
  "executables/activity",
  "executables/calculator",
  "executables/clock",
  "executables/debug",
  "executables/file_manager",
  "executables/pixel_painter",
  "executables/settings",
  "executables/synth",
  "executables/terminal",
  "executables/text_editor",
  "executables/weather",
  "executables/shell/command_line",
  "executables/shell/graphical",
]

[patch.crates-io]
littlefs2-sys = { git = "https://github.com/xila-project/core", rev = "31089029263ac40a4cd9cd4fc0be1cd3693e2113" }
