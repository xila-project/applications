[package]
name = "xila-package-application"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Native, CLI-only Xila package installer (verified once at installation)"

[dependencies]
xila = { workspace = true, default-features = true }
xila_version = { workspace = true }
getargs = { version = "0.5", default-features = false }
getargs-derive = { workspace = true }
portable-atomic = { workspace = true }
xila-package-reader = { git = "https://github.com/xila-project/package_manager", branch = "main" }
xila-package-manifest = { git = "https://github.com/xila-project/package_manager", branch = "main" }
xila-package-manager = { git = "https://github.com/xila-project/package_manager", branch = "main" }
xila-package-verification = { git = "https://github.com/xila-project/package_manager", branch = "main", default-features = false, features = [
  "sha256",
  "ed25519",
] }
tar-no-std = { version = "0.6.0", default-features = false }

[lib]
name = "package"
path = "src/lib.rs"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
testing = { workspace = true }
critical-section = { workspace = true, features = ["std"] }

[dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
