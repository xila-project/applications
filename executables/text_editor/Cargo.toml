[package]
name = "xila-text-editor"
version = "0.2.1"
edition = "2024"
rust-version.workspace = true
build = "../wasm_guest_build.rs"
description = "A page-based text editor for Xila WebAssembly."

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
embedded-i18n = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { workspace = true, default-features = false, features = [
  "guest",
  "graphics",
  "memory_32",
] }

[[bin]]
name = "text_editor"
path = "src/main.rs"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
