[package]
name = "xila-activity"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-i18n = { workspace = true }
xila = { workspace = true, default-features = true, features = ["graphics"] }
embassy-futures = { workspace = true }

[dev-dependencies]
testing = { workspace = true }
xila = { workspace = true, default-features = true, features = [
  "graphics_rendering_xrgb8888",
] }
critical-section = { workspace = true, features = ["std"] }

[lib]
name = "activity"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
