[package]
name = "xila-debug-application"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
xila = { workspace = true, default-features = true, features = [
  "graphics_rendering_xrgb8888",
] }
log = { workspace = true }
debug_protocol = { workspace = true }
portable-atomic = { workspace = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
testing = { workspace = true }
critical-section = { workspace = true, features = ["std"] }

[lib]
name = "debug_application"
