[package]
name = "xila-clock"
version = "0.1.1"
edition = "2024"
description = "A bounded Clock application for Xila's WebAssembly runtime."
license = "GPL-2.0-only"

[dependencies]
embedded-i18n = { workspace = true }

[dev-dependencies]
audio = { workspace = true }
file_system = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { workspace = true, default-features = false, features = [
  "guest",
  "graphics",
  "memory_32",
] }

[[bin]]
name = "clock"
path = "src/main.rs"

[lib]
name = "clock"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
