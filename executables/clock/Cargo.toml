[package]
name = "xila-clock"
version = "0.2.1"
edition = "2024"
rust-version.workspace = true
build = "../wasm_guest_build.rs"
description = "A bounded Clock application for Xila's WebAssembly runtime."
license = "Apache-2.0"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
embedded-i18n = { workspace = true }

[dev-dependencies]
audio = { workspace = true }
file_system = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { workspace = true, default-features = false, features = [
  "guest",
  "graphics",
  "memory_32",
] }

[[bin]]
name = "clock"
path = "src/main.rs"

[lib]
name = "clock"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
