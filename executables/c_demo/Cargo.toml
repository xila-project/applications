[package]
name = "xila-c-demo"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Built-in native C ABI demonstration"

[lib]
name = "c_demo"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
abi_application = { workspace = true }
executable = { workspace = true, features = ["native-linked"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
authentication = { workspace = true }
file_system = { workspace = true }
task = { workspace = true, features = ["test_harness"] }
testing = { workspace = true }
virtual_file_system = { workspace = true }

[build-dependencies]
cc = "1"
