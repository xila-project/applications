[package]
name = "xila-synth"
version = "0.2.2"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[build-dependencies]
wasm_guest_build = { workspace = true }

[dependencies]
embedded-i18n = { workspace = true }
nanoaudio = { workspace = true, default-features = false, features = ["dsp"] }
nanoaudio-synth = { workspace = true }

[dev-dependencies]
audio = { workspace = true }
file_system = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { workspace = true, default-features = false, features = [
  "guest",
  "graphics",
  "memory_32",
] }

[[test]]
name = "build_test"
path = "tests/build_test.rs"

[[bin]]
name = "synth"
path = "src/main.rs"

[lib]
name = "synth"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
