[package]
name = "xila-dashboard"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Shows Grafana panel values and charts on a Xila device."

[build-dependencies]
wasm_guest_build = { workspace = true }

[dependencies]
embedded-i18n = { workspace = true }
miniserde = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { workspace = true, default-features = false, features = [
  "guest",
  "graphics",
  "memory_32",
] }

[[bin]]
name = "dashboard"
path = "src/main.rs"

[lib]
name = "dashboard"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
