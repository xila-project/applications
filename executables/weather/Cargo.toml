[package]
name = "xila-weather"
version = "0.2.2"
edition = "2024"
rust-version.workspace = true
license.workspace = true
build = "../wasm_guest_build.rs"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
embedded-i18n = { workspace = true }
miniserde = { workspace = true }
shared = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { workspace = true, default-features = false, features = [
  "guest",
  "graphics",
  "memory_32",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
file_system = { workspace = true }
task = { workspace = true, features = ["test_harness"] }
virtual_file_system = { workspace = true }
xila = { workspace = true, default-features = true, features = [
  "graphics",
  "executable_building",
  "graphics_rendering_xrgb8888",
] }
drivers_core = { workspace = true }
testing = { workspace = true }
wasm = { workspace = true, default-features = true, features = ["graphics"] }
critical-section = { workspace = true, features = ["std"] }

[[test]]
name = "build_test"
path = "tests/build_test.rs"

[[test]]
name = "weather_test"
path = "tests/test.rs"

[[bin]]
name = "weather"
path = "src/main.rs"

[lib]
name = "weather"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
