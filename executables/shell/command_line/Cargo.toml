[package]
name = "xila-command-line-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-futures = { workspace = true }
embedded-i18n = { workspace = true }
xila = { workspace = true, default-features = false }
getargs = { version = "0.5", default-features = false }
getargs-derive = { workspace = true }

[features]
default = ["network"]
network = ["xila/network"]

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
drivers_core = { workspace = true }
time = { workspace = true }
little_fs = { workspace = true }
testing = { workspace = true }
critical-section = { workspace = true, features = ["std"] }

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[lib]
name = "command_line_shell"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
