[package]
name = "xila-command-line-shell"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = { version = "0.22", default-features = false, optional = true }
embassy-futures = { workspace = true }
embedded-i18n = { workspace = true }
device = { workspace = true, optional = true }
time_zone = { workspace = true, optional = true }
xila = { workspace = true, default-features = false }
getargs = { version = "0.5", default-features = false }
getargs-derive = { workspace = true }

[features]
default = ["network", "time-commands", "time-zone-command"]
network = ["xila/network"]
crash-command = ["xila/crash", "dep:base64"]
# The date, uptime and real_time_clock commands. Off on flash-constrained
# boards such as the Nano 33 BLE, which builds this shell with
# default-features = false.
time-commands = [
  "dep:device",
  "dep:time_zone",
  "xila/time_services",
  "xila/time_zone",
]
# The `time_zone` command: show and set the system time zone. It links the
# time zone code of Core (about 11 KB on Cortex-M); boards with little flash
# leave it out.
time-zone-command = ["xila/time_zone"]

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
drivers_core = { workspace = true }
drivers_peripherals = { workspace = true, features = ["real-time-clock"] }
peripherals = { workspace = true, features = ["mock"] }
time = { workspace = true }
little_fs = { workspace = true }
testing = { workspace = true }
critical-section = { workspace = true, features = ["std"] }

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[lib]
name = "command_line_shell"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
