[vars]
rust_version = "1.99.0"
node_version = "24.22.0"
taplo_version = "0.10.0"
actionlint_version = "1.7.7"
shellcheck_version = "0.11.0"

[tasks."check:guest"]
description = "Check all WASI guest applications"
run = "cargo check --locked --target wasm32-wasip1 -p xila-calculator -p xila-clock -p xila-weather -p xila-pixel-painter -p xila-text-editor -p xila-synth -p xila-digits"

[tasks."build:applications"]
description = "Build the seven WASI application artifacts"
run = "cargo build --locked --target wasm32-wasip1 --profile release-wasm -p xila-calculator -p xila-clock -p xila-weather -p xila-pixel-painter -p xila-text-editor -p xila-synth -p xila-digits"

[tasks."test:workspace"]
description = "Test application crates on the host"
run = "cargo test --locked --workspace --features xila/graphics_rendering_xrgb8888"

[tasks."localization:lint"]
description = "Validate application translation keys and catalogs"
run = "node tools/localization/check.mjs && node --test tolgee.extractor.test.mjs tools/localization/catalog.test.mjs"

[tasks."docs:guest"]
description = "Build WebAssembly guest API documentation"
run = "cargo doc --locked --package xila-wasm --no-default-features --features default_guest --target wasm32-wasip1 --no-deps"

[tasks."docs:host"]
description = "Build host application and runtime documentation"
run = "cargo doc --locked --workspace --features xila-wasm/graphics,xila/graphics_rendering_xrgb8888 --target x86_64-unknown-linux-gnu --no-deps"
