[vars]
rust_version = "1.97.0"
node_version = "24.22.0"
taplo_version = "0.10.0"
nextest_version = "0.9.148"
actionlint_version = "1.7.7"
shellcheck_version = "0.11.0"
binaryen_version = "133"

[tasks."check:guest"]
description = "Check all WASI guest applications"
run = "cargo check --locked --target wasm32-wasip1 -p xila-calculator -p xila-clock -p xila-weather -p xila-pixel-painter -p xila-text-editor -p xila-synth -p xila-digits"

[tasks."build:applications"]
description = "Build and size-optimize the seven WASI application artifacts"
tools."aqua:WebAssembly/binaryen" = "{{ vars.binaryen_version }}"
run = """
set -eu
cargo build --locked --target wasm32-wasip1 --profile release-wasm -p xila-calculator -p xila-clock -p xila-weather -p xila-pixel-painter -p xila-text-editor -p xila-synth -p xila-digits
for application in calculator clock weather pixel_painter text_editor synth digits; do
  module="target/wasm32-wasip1/release-wasm/$application.wasm"
  wasm-opt -Oz \
    --strip-debug \
    --strip-dwarf \
    --strip-producers \
    --enable-mutable-globals \
    --enable-sign-ext \
    --enable-nontrapping-float-to-int \
    --enable-multivalue \
    --enable-bulk-memory \
    --enable-reference-types \
    --enable-tail-call \
    --enable-extended-const \
    "$module" -o "$module.optimized"
  mv "$module.optimized" "$module"
done
"""

[tasks."test:workspace"]
description = "Test application crates on the host"
tools."github:nextest-rs/nextest" = "cargo-nextest-{{ vars.nextest_version }}"
run = """
set -eu
cargo nextest run --locked --workspace --features xila/graphics_rendering_xrgb8888
cargo test --locked --workspace --features xila/graphics_rendering_xrgb8888 --doc
"""

[tasks."localization:lint"]
description = "Validate application translation keys and catalogs"
run = "node tools/localization/check.mjs && node --test tolgee.extractor.test.mjs tools/localization/catalog.test.mjs"

[tasks."docs:guest"]
description = "Build WebAssembly guest API documentation"
run = "cargo doc --locked --package xila-wasm --no-default-features --features default_guest --target wasm32-wasip1 --no-deps"

[tasks."docs:host"]
description = "Build host application and runtime documentation"
run = "cargo doc --locked --workspace --features xila-wasm/graphics,xila/graphics_rendering_xrgb8888 --target x86_64-unknown-linux-gnu --no-deps"
