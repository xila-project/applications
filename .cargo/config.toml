[env]
DEP_LV_CONFIG_PATH = { value = "config/lvgl", relative = true }
EMBEDDED_I18N_LOCALE = "en"
XILA_LV_FONT_CONV_DIR = { value = "node_modules/lv_font_conv", relative = true }
# Core's font build includes the selected workspace's translated glyphs.
XILA_FONT_CATALOG_ROOTS = { value = ".", relative = true }

[target.wasm32-wasip1]
# Reserve one Wasm page for the stack to reduce initial linear memory on devices.
rustflags = ["-C", "link-arg=-zstack-size=65536"]
