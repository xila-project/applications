[wrappers.cargo]
command = "env"
args = [
  "{% if env.XILA_MBX | default(value='0') == '1' %}mbx{% else %}cargo{% endif %}",
]
env = { MBX_CARGO_SHIM_MODE = "1" }

[task_templates."ci:rust-wasi".tools]
rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "wasm32-wasip1",
] }

[tasks."ci:format-rust"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "rustfmt",
] }
run = "cargo fmt --all -- --check"

[tasks."ci:format-toml"]
tools.taplo = "{{ vars.taplo_version }}"
run = "taplo format --check"

[tasks."check:guest"]
extends = "ci:rust-wasi"

[tasks."ci:test-guest-header"]
extends = "ci:rust-wasi"
env.XILA_CHECK_WASM_GRAPHICS_HEADER = "1"
run = "cargo check --locked --target wasm32-wasip1 -p xila-wasm --no-default-features --features default_guest"

[tasks."build:applications"]
extends = "ci:rust-wasi"

[tasks."test:workspace"]
extends = "ci:rust-wasi"

[tasks."ci:abi"]
description = "Run the locked WebAssembly ABI translation tests, including documentation tests"
tools."github:nextest-rs/nextest" = "cargo-nextest-{{ vars.nextest_version }}"
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal" }
run = """
set -eu
manifest=executables/wasm/tests/translation/Cargo.toml
cargo nextest run --locked --manifest-path "$manifest" --no-default-features --features "${CI_ABI_MEMORY:?}"
cargo test --locked --manifest-path "$manifest" --no-default-features --features "${CI_ABI_MEMORY:?}" --doc
"""

[tasks."docs:guest"]
extends = "ci:rust-wasi"

[tasks."docs:host"]
extends = "ci:rust-wasi"

[tasks."ci:toolchain"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal" }
run = '''
set -eu
rustc --version
if [ -n "${GITHUB_OUTPUT:-}" ]; then
  echo "version={{ vars.rust_version }}" >> "$GITHUB_OUTPUT"
fi
'''

[tasks."ci:clippy-guest"]
extends = "ci:rust-wasi"
run = "cargo clippy --locked --target wasm32-wasip1 -p xila-calculator -p xila-clock -p xila-weather -p xila-pixel-painter -p xila-text-editor -p xila-synth -p xila-digits -p xila-dashboard -- -D warnings"

[tasks."ci:clippy-host"]
extends = "ci:rust-wasi"
run = "cargo clippy --locked -p xila-c-demo -p xila-activity -p xila-debug-application -p xila-file-manager -p xila-settings -p xila-terminal -p xila-command-line-shell -p xila-graphical-shell -p xila-package-application --all-targets --features xila/graphics_rendering_xrgb8888 -- -D warnings"

[tasks."ci:localization"]
extends = "ci:rust-wasi"
run = """
set -eu
cargo check --locked --target wasm32-wasip1 -p xila-calculator -p xila-clock -p xila-weather -p xila-pixel-painter -p xila-text-editor -p xila-synth -p xila-digits -p xila-dashboard
"""

[tasks."ci:localization-group"]
description = "Check each locale independently on one runner"
run = """
set -eu
failed=""
checked=0
for locale in ${CI_LOCALES:?}; do
  checked=$((checked + 1))
  printf '::group::Localization (%s)\\n' "$locale"
  EMBEDDED_I18N_LOCALE="$locale" CARGO_TARGET_DIR="target/localization/$locale" mise run ci:localization || failed="$failed $locale"
  printf '::endgroup::\\n'
done
if [ "$checked" -eq 0 ]; then
  echo "::error::CI_LOCALES names no locale"
  exit 1
fi
if [ -n "$failed" ]; then
  echo "::error::Localization check failed for:$failed"
  exit 1
fi
"""

[tasks."ci:core-revision"]
description = "Write the Core commit locked in Cargo.lock to the step output"
run = 'python3 tools/ci/locked_revision.py core >> "$GITHUB_OUTPUT"'

[tasks."ci:font-japanese"]
description = "Install the verified Japanese font from the matching Core checkout"
run = "bash .ci-core-fonts/tools/localization/fetch-japanese-font.sh"

[tasks."localization:lint"]
tools.node = "{{ vars.node_version }}"

[tasks."ci:lint-workflows"]
tools."aqua:rhysd/actionlint" = "{{ vars.actionlint_version }}"
tools."aqua:koalaman/shellcheck" = "{{ vars.shellcheck_version }}"
run = "actionlint"

# Native libraries are installed on demand through mise bootstrap.
[bootstrap.packages]
"apt:clang" = { env = "ci" }
"apt:libclang-dev" = { env = "ci" }
"apt:pkg-config" = { env = "host" }
"apt:libasound2-dev" = { env = "host" }
"apt:libudev-dev" = { env = "host" }
"apt:libxkbcommon-dev" = { env = "host" }
"apt:libwayland-dev" = { env = "host" }
"apt:libx11-dev" = { env = "host" }
"apt:libxkbcommon-x11-dev" = { env = "host" }

[tasks."ci:packages-linker"]
description = "Install required CI linker packages through mise bootstrap"
run = "mise -E ci bootstrap packages apply --manager apt --update --yes"

[tasks."ci:packages-host"]
description = "Install required native GUI and linker packages through mise bootstrap"
run = "mise -E ci,host bootstrap packages apply --manager apt --update --yes"

[tasks."ci:deps-npm"]
description = "Install locked application Node dependencies with the pinned toolchain"
tools.node = "{{ vars.node_version }}"
run = "npm ci"

[tasks."ci:stage-package"]
description = "Validate one application's manifest and shortcut and stage the input directory of the package action"
run = 'python3 tools/ci/stage_package.py --application "${CI_APPLICATION:?}" --wasm-directory "${CI_WASM_DIRECTORY:?}" --output "${CI_PACKAGE_STAGING:?}"'

[tasks."ci:verify-package"]
description = "Verify the produced package with xila-package, write its SHA-256 sidecar and report the digest"
run = "bash tools/ci/verify_package.sh"

[tasks."ci:quality-extra"]
description = "Validate application manifests, workflows, and localization"
run = """
set -eu
python3 tools/validate_manifests.py
python3 -m unittest discover -s tools/ci -v
mise run localization:lint
"""
