[wrappers.cargo]
command = "env"
args = ["{% if env.XILA_MBX | default(value='0') == '1' %}mbx{% else %}cargo{% endif %}"]
env = { MBX_CARGO_SHIM_MODE = "1" }

[task_templates."ci:rust-wasi".tools]
rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["wasm32-wasip1"] }

[tasks."ci:format-rust"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = ["rustfmt"] }
run = "cargo fmt --all -- --check"

[tasks."ci:format-toml"]
tools.taplo = "{{ vars.taplo_version }}"
run = "taplo format --check"

[tasks."check:guest"]
extends = "ci:rust-wasi"

[tasks."build:applications"]
extends = "ci:rust-wasi"

[tasks."test:workspace"]
extends = "ci:rust-wasi"
